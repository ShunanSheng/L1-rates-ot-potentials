[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otexp"
version = "0.1.0"
description = "Numerical experiments for empirical OT potentials on the unit ball."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
notebook = [
    "ipykernel",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]
